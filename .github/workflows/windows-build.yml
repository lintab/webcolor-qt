name: Windows Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtnetworkauth'
        cache: true

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build
      run: |
        mkdir build-win
        cd build-win
        cmake .. -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"
        nmake

    - name: Package Qt dependencies
      run: |
        cd build-win
        windeployqt WebColorQt.exe --no-translations --no-system-d3d-compiler --no-opengl-sw

    - name: Build Inno Setup installer
      shell: pwsh
      run: |
        $iscc = Get-ChildItem "C:\Program Files*\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
        if (-not $iscc) { Write-Error "Inno Setup not found"; exit 1 }
        & $iscc setup.iss

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: 恺祁颜色系统-安装程序
        path: installer-output/*.exe
        retention-days: 30

    - name: Upload portable zip
      run: |
        cd build-win
        7z a ../WebColorQt-Windows.zip *
      
    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: WebColorQt-Windows-Portable
        path: WebColorQt-Windows.zip
        retention-days: 30
